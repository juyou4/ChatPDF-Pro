name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan tracked source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Historical commits contain data that must be removed separately. Scan the
      # current tracked tree here so new commits are blocked without re-reporting it.
      - name: Detect secrets
        uses: docker://zricethezav/gitleaks:v8.30.0
        with:
          args: detect --no-git --source . --redact --exit-code 1
