name: ChatPDF Local Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-local:
    name: Backend local regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: python -m pip install -r backend/requirements-core.txt pytest pytest-asyncio

      - name: Compile changed backend contracts
        run: >-
          python -m py_compile
          backend/services/full_document_summary_request.py
          backend/services/chat_intent_service.py
          backend/services/full_document_summary_service.py
          backend/services/reading_outline_quality_service.py
          backend/services/reading_outline_quality_gate.py
          backend/services/reading_outline_service.py
          backend/scripts/check_reading_outline_gate.py
          backend/routes/chat_routes.py

      - name: Run local reliability regression
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_chat_routes_non_stream.py
          tests/test_overview_service.py
          tests/test_reading_outline_overview_contract.py
          tests/test_reading_outline_quality_gate.py
          tests/test_structure_aware_split.py
          tests/test_vector_context_identity_passthrough.py

  frontend-local:
    name: Frontend local regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run selection and streaming regressions
        working-directory: frontend
        run: >-
          npm run test -- --run
          src/utils/__tests__/pdfSelectionUtils.test.js
          src/utils/__tests__/answerCriticUtils.coverage.test.js
          src/hooks/__tests__/useMessageState.test.js

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Check patch whitespace
        run: git diff --check
